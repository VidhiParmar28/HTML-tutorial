<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tag</title>
</head>
<body>
    <img src="amazon-logo-transparent-free-png.webp" alt="image of amazon">
    <p>This image tag is used to tag/add the image on website. the alt attribute means if the image is not visible then the user gets to know that image is of amazon logo.</p>
</body>
</html>
