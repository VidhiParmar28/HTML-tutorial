<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table tag</title>
</head>
<body>
    <table>
        <caption>INFORMATION</caption>
        <thead>
            <tr>
                <th>name</th>
                <th>rollno.</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>vidhi</td>
                <td>1</td>
            </tr>
        </tbody>
    </table>

    <p>table tag is used for table.</p>
    <p>thead tag is for heading.</p>
    <p>tr tag is row.</p>
    <p>td tag is table data.</p>
    <p>th tag is heading.</p>
    <p>caption tag is main heading.</p>
    <p>colspan tag is used to merge column.</p>
    <p>colrow </p>
    
</body>
</html>
